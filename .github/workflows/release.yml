name: Build and Release
run-name: '${{ github.event.head_commit.message }}'

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build XrayCore AAR
        run: |
          mkdir -p app/libs
          cd XrayCore
          go mod init XrayCore || true
          go mod edit -replace github.com/xtls/xray-core=./Xray-core || true
          go mod edit -replace github.com/xtls/libxray=./libXray || true
          go mod tidy || true
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          gomobile bind -o ../app/libs/XrayCore.aar -androidapi 26 -target android -ldflags="-checklinkname=0 -buildid=" -trimpath || true
          cd ..
          ls -la app/libs/

      - name: Setup Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK (Release & Debug)
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Generate Release Tag & Name
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            BASE_VER=$(grep 'versionName =' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | cut -d'.' -f1,2)
            if [ -z "$BASE_VER" ]; then
              BASE_VER="12.6"
            fi
            TAG_NAME="v${BASE_VER}.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=Release ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: |
            ## Automated Build Release
            - **Commit**: `${{ github.sha }}`
            - **Message**: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
